[metadata:main]
identification_title = Albatross
identification_abstract = Seasonal hydroclimatic forecasting from teleconnections, with leakage-free cross-validated skill.
identification_keywords = PyWPS, WPS, OGC, birdhouse, seasonal forecast, teleconnections, climate services
provider_name = Politecnico di Milano / CLINT
provider_url = https://climateintelligence.eu/
contact_name = Giulio Palcic
contact_email = giulio.palcic@polimi.it
contact_city = Milan
contact_country = Italy

[server]
url = http://localhost:5000/wps
outputurl = http://localhost:5000/outputs
allowedinputpaths = /
maxsingleinputsize = 200mb
maxprocesses = 10
parallelprocesses = 2

[logging]
level = INFO
file = albatross.log
format = %(asctime)s] [%(levelname)s] line=%(lineno)s module=%(module)s %(message)s
