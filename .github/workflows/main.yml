name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install dependencies from the requirements.txt file in the root directory
        pip install -r requirements.txt

    - name: Check that the service imports
      run: |
        pip install -e .
        python -c "from albatross.processes.wps_drought import Drought; Drought()"
